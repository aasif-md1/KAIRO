name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/findings
          pip install -e packages/analysis
          pip install -e packages/rules
          pip install -e apps/api
          pip install pytest pytest-asyncio httpx ruff pyyaml pydantic tree-sitter tree-sitter-python tree-sitter-javascript tree-sitter-typescript aiosqlite fastapi sqlalchemy cryptography python-multipart

      - name: Run Ruff Linting
        run: |
          ruff check apps/ packages/ tests/

      - name: Run Brand Guardrails Validation
        run: |
          python scripts/check_brand_rules.py

      - name: Run Security, Static Rule, and Tenant Isolation Tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v -ra --tb=short 2>&1 | tee /tmp/pytest.log

      - name: Report Pytest Failure
        if: failure()
        run: |
          if [ -f /tmp/pytest.log ]; then
            echo "### Pytest Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              echo "::error title=Pytest Error::$line"
            done < /tmp/pytest.log
          fi
