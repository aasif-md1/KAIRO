name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -e packages/findings -e apps/api
          uv pip install pytest pytest-asyncio httpx ruff

      - name: Run Ruff Linting
        run: |
          uv run ruff check .

      - name: Run Brand Guardrails Validation
        run: |
          uv run python scripts/check_brand_rules.py

      - name: Run Security and Tenant Isolation Tests
        run: |
          uv run pytest tests/ -v
