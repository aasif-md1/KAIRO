name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/findings
          pip install -e packages/analysis
          pip install -e packages/rules
          pip install -e apps/api
          pip install pytest pytest-asyncio httpx ruff

      - name: Run Ruff Linting
        run: |
          ruff check apps/ packages/ tests/

      - name: Run Brand Guardrails Validation
        run: |
          python scripts/check_brand_rules.py

      - name: Run Security, Static Rule, and Tenant Isolation Tests
        run: |
          pytest tests/ -v
