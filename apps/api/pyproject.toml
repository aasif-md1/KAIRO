[project]
name = "kairo-api"
version = "0.1.0"
description = "KAIRO REST API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "cryptography>=43.0.0",
    "kairo-findings",
    "kairo-analysis",
]

[tool.uv.sources]
kairo-findings = { workspace = true }
kairo-analysis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
