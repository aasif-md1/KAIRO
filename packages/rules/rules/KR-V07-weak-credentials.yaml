id: KR-V07-weak-credentials
class: V07
title: Weak credential storage or insecure cookie attributes
severity: high
languages:
  - python
  - javascript
  - typescript
frameworks:
  - express
  - nextjs
  - fastapi
  - flask
analyzer: weak_credentials
message: "Deprecated cryptographic hash function (MD5/SHA1) or cookie with disabled security flags."
remediation: "Upgrade password hashing to Argon2id or bcrypt, and ensure cookies enable HttpOnly and Secure."
