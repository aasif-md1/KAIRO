[project]
name = "kairo-workspace"
version = "0.1.0"
description = "KAIRO: Access-control and secret-handling audit platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/analysis",
    "packages/rules",
    "packages/findings",
]

[tool.uv.sources]
kairo-findings = { workspace = true }
kairo-analysis = { workspace = true }
kairo-rules = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "benchmark",
    "packages/rules/fixtures",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = [
    "kairo_api",
    "kairo_worker",
    "kairo_runner",
    "kairo_analysis",
    "kairo_rules",
    "kairo_model_client",
    "kairo_tester",
    "kairo_findings",
    "kairo_reports",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = [
    "apps",
    "packages",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
