services:
  postgres:
    image: postgres:17-alpine
    container_name: kairo-postgres
    environment:
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo_dev_secret
      POSTGRES_DB: kairo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kairo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kairo_minio_admin
      MINIO_ROOT_PASSWORD: kairo_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-github:
    build:
      context: ./mock-github
      dockerfile: Dockerfile
    container_name: kairo-mock-github
    ports:
      - "8080:8080"
    environment:
      PORT: 8080

volumes:
  postgres_data:
  minio_data:
